spring:
  # DB_URL accepts either a proper JDBC URL (jdbc:postgresql://host:port/db)
  # or Render's raw "Internal/External Database URL" format
  # (postgresql://user:pass@host/db) — RenderDatabaseUrlEnvironmentPostProcessor
  # auto-converts the latter into proper JDBC form + separate credentials
  # before Spring's datasource auto-config reads it, so either can be pasted
  # directly from Render's dashboard without manual reformatting.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mtotocare}
    username: ${DB_USERNAME:mtotocare}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    baseline-version: 0

  h2:
    console:
      enabled: false

mtotocare:
  attachments:
    storage-path: ${UPLOAD_DIR:/var/mtotocare/uploads}
    max-file-size-mb: 10

logging:
  level:
    com.mtotocare.africa: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
