spring:
  application:
    name: mtotoCare-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:h2:mem:mtotocare;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

mtotocare:
  jwt:
    # 256-bit secret (32+ characters) - CHANGE IN PRODUCTION
    secret: ${JWT_SECRET:MtotoCareAfricaJWTSecretKey2026SecureKeyForDevelopmentOnlyDoNotUseInProduction}
    access-token-expiration: 900000      # 15 minutes
    refresh-token-expiration: 604800000  # 7 days
  cors:
    allowed-origins: http://localhost:8081,http://localhost:19006,exp://localhost:19000
  email:
    # Sender info. from-address MUST match GMAIL_USER (Gmail rejects mismatched senders).
    from-address: ${MAIL_FROM:georgegibosi850@gmail.com}
    from-name: ${MAIL_FROM_NAME:MtotoCare Africa}
    reply-to-address: ${MAIL_REPLY_TO:georgegibosi850@gmail.com}
    # Where the email's button should point. Mobile deep-link: mtotocare://reset-password?token=...
    app-base-url: ${APP_BASE_URL:http://localhost:8081}
    # Set EMAIL_SANDBOX=false to send real emails. Auto-falls-back to sandbox if GMAIL_USER is blank.
    sandbox-mode: ${EMAIL_SANDBOX:false}
  # AI provider for the AI Assistant. Get a free key at https://console.groq.com/keys
  # Without a key, the system uses a safe offline library (no real AI).
  ai:
    provider: ${AI_PROVIDER:groq}             # groq | openai | mock
    api-key: ${GROQ_API_KEY:}
    model: ${AI_MODEL:}                       # leave blank for default (llama-3.3-70b-versatile)
    timeout-ms: 20000
    max-tokens: 600
    temperature: 0.4

# Gmail SMTP — used when sandbox-mode is off and SENDGRID_API_KEY is blank.
# Get a Gmail App Password: https://myaccount.google.com/apppasswords
# (requires 2-Step Verification to be enabled first)
spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${GMAIL_USER:georgegibosi850@gmail.com}
  password: ${GMAIL_APP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 10000
        timeout: 10000
        writetimeout: 10000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# File upload limits (FR-077/078)
spring.servlet.multipart:
  enabled: true
  max-file-size: 10MB
  max-request-size: 12MB

logging:
  level:
    com.mtotocare.africa: DEBUG
    org.springframework.security: INFO
