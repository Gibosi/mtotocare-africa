spring:
  datasource:
    url: jdbc:h2:mem:mtotocare;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Flyway is disabled in dev - JPA creates/updates the schema
  flyway:
    enabled: false
    baseline-on-migrate: false
    validate-on-migrate: false
    clean-disabled: true

  h2:
    console:
      enabled: true
      path: /h2-console
