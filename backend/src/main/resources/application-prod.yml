spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mtotocare?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:mtotocare}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    baseline-version: 0

  h2:
    console:
      enabled: false

mtotocare:
  attachments:
    storage-path: ${UPLOAD_DIR:/var/mtotocare/uploads}
    max-file-size-mb: 10

logging:
  level:
    com.mtotocare.africa: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
